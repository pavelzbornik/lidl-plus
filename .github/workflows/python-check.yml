name: Python check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Install dependencies
      run: uv sync --all-extras --dev --python ${{ matrix.python-version }}
    - name: Lint with ruff
      run: uv run ruff check .
    - name: Check formatting with ruff
      run: uv run ruff format --check .
    - name: Analysing the code with pylint
      run: uv run pylint --max-line-length 120 lidlplus/

  type-check:
    # Modern mypy can't run on Python 3.8, so type-check once on a current
    # interpreter rather than across the runtime matrix.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Install dependencies
      run: uv sync --all-extras --dev --python 3.12
    - name: Type-check with mypy
      run: uv run mypy
