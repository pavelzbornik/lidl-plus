[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lidl-plus"
version = "0.3.5"
description = "Fetch receipts and more from Lidl Plus"
readme = "README.md"
requires-python = ">=3.8.1"
license = { file = "LICENCE" }
authors = [{ name = "Andre Basche" }]
keywords = ["lidl", "lidl plus", "receipts", "coupons", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.1",
    "lxml>=5.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Browser login to obtain a refresh token. Not needed for refresh-token-only use.
auth = [
    "getuseragent>=0.0.7",
    "oic>=1.4.0",
    "selenium-wire>=5.1.0",
    "webdriver-manager>=3.8.5",
    "blinker==1.7.0",
]

[project.scripts]
lidl-plus = "lidlplus.__main__:start"

[project.urls]
GitHub = "https://github.com/Andre0512/lidl-plus"
PyPI = "https://pypi.org/project/lidl-plus/"

[dependency-groups]
dev = [
    "black>=22.12",
    "flake8>=6.0",
    "mypy>=0.991",
    "pylint>=2.15",
]

[tool.hatch.build.targets.wheel]
packages = ["lidlplus"]

[tool.black]
line-length = 120

[tool.pylint.format]
max-line-length = 120

[tool.pylint.main]
# Gate CI on the overall score rather than zero-tolerance; the HTML receipt parser
# is legitimately branch-heavy.
fail-under = 9.0

[tool.pylint."messages control"]
disable = ["too-many-branches", "too-many-locals"]
