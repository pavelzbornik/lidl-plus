[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lidl-plus"
version = "0.4.0"
description = "Fetch receipts and more from Lidl Plus"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENCE" }
authors = [{ name = "Andre Basche" }]
keywords = ["lidl", "lidl plus", "receipts", "coupons", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.1",
    "lxml>=5.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Browser login to obtain a refresh token. Not needed for refresh-token-only use.
auth = [
    "getuseragent>=0.0.7",
    "oic>=1.4.0",
    "selenium-wire>=5.1.0",
    "webdriver-manager>=3.8.5",
    "blinker==1.7.0",
]

[project.scripts]
lidl-plus = "lidlplus.__main__:start"

[project.urls]
GitHub = "https://github.com/Andre0512/lidl-plus"
PyPI = "https://pypi.org/project/lidl-plus/"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=0.991",
    "pylint>=2.15",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lidlplus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests hit the real Lidl API; deselect them by default so the
# normal run stays offline. Opt in with: uv run pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: live tests that call the real Lidl Plus API (network + token)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "dist", "build", "*.egg-info"]

[tool.ruff.lint]
# pyflakes (F) + pycodestyle (E/W) reproduce the old flake8 coverage;
# pyupgrade (UP) and bugbear (B) are cheap, high-value extras.
select = ["E", "F", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["lidlplus"]

# These libs ship no type information; lxml's own stubs type xpath() as a broad
# union that isn't worth fighting, so we treat all three as untyped.
[[tool.mypy.overrides]]
module = ["lxml.*", "getuseragent", "seleniumwire.*"]
ignore_missing_imports = true

[tool.pylint.format]
max-line-length = 120

[tool.pylint.main]
# Gate CI on the overall score rather than zero-tolerance; the HTML receipt parser
# is legitimately branch-heavy.
fail-under = 9.0

[tool.pylint."messages control"]
# The connector class legitimately holds API config as instance state, and its
# constructor mirrors the auth/cache options as keyword arguments.
disable = [
    "too-many-branches",
    "too-many-locals",
    "too-many-instance-attributes",
    "too-many-arguments",
    "too-many-positional-arguments",
]
